name: Personal nightly release

on:
  schedule:
    # GitHub cron schedules use UTC. Run at midnight, middle of night, morning,
    # midday, and afternoon without using minute zero, which GitHub can delay.
    - cron: "17 0,4,8,12,16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when the current commit already has a personal release
        required: false
        default: false
        type: boolean

concurrency:
  group: personal-nightly-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Rebase onto upstream main
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout personal main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - id: rebase
        name: Rebase patch stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main --tags --force
          origin_sha="$(git rev-parse HEAD)"
          echo "origin_sha=$origin_sha" >> "$GITHUB_OUTPUT"

          set +e
          git rebase upstream/main
          rebase_status=$?
          set -e

          if [[ "$rebase_status" -eq 0 ]]; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "result=error" >> "$GITHUB_OUTPUT"
          exit "$rebase_status"

      - name: Require Codex fallback secret
        if: steps.rebase.outputs.result == 'conflict'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY is required to resolve an automatic rebase conflict." >&2
            exit 1
          fi

      - name: Remove checkout credentials before Codex
        if: steps.rebase.outputs.result == 'conflict'
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-regexp '^includeIf\.gitdir:' || true
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Resolve rebase conflict with Codex
        if: steps.rebase.outputs.result == 'conflict'
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bot-users: github-actions[bot]
          prompt: |
            You are the conflict resolver for a trusted automated rebase of lmdevv/t3code.

            The checkout is already in an active Git rebase from the personal fork's main
            branch onto the official upstream main branch. Finish this rebase in the current
            checkout while preserving the intended functionality from both sides.

            Start by inspecting:
              git status --short
              git diff --name-only --diff-filter=U
              git diff --cc
              git rebase --show-current-patch

            Resolve every current conflict deliberately. Keep upstream's current architecture,
            behavior, accessibility, and styling, then port the personal fork's Vim-style picker
            and navigation behavior into that current implementation. In particular, do not
            replace a newer upstream component with an older fork-wide rewrite just because the
            two versions overlap.

            Rules:
            - Do not use git rebase --abort, git rebase --skip, git reset --hard, or blanket
              checkout/accept-ours/accept-theirs/accept-both conflict resolution.
            - Resolve only files reported as unmerged. Do not change workflow files, auth,
              secrets, lockfiles, or unrelated files.
            - Do not push, fetch, access the network, or create a separate commit outside the
              active rebase. The surrounding workflow owns the push after validation.
            - After resolving each conflict, stage it and continue with
              GIT_EDITOR=true git rebase --continue until the rebase is complete.
            - Before finishing, run git diff --check and git status --short. Leave no conflict
              markers, no untracked files, and no active rebase. If you cannot resolve safely,
              leave the rebase unresolved and explain why rather than guessing.

      - name: Validate completed Codex rebase
        if: steps.rebase.outputs.result == 'conflict'
        shell: bash
        run: |
          set -euo pipefail
          if git rebase --show-current-patch >/dev/null 2>&1; then
            echo "Codex did not complete the active rebase." >&2
            exit 1
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Codex left unmerged files." >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git diff --check
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Codex left a dirty worktree." >&2
            git status --short >&2
            exit 1
          fi

      - name: Push rebased personal main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGIN_SHA: ${{ steps.rebase.outputs.origin_sha }}
        run: |
          set -euo pipefail
          rebased_sha="$(git rev-parse HEAD)"
          if [[ "$rebased_sha" == "$ORIGIN_SHA" ]]; then
            echo "Personal main is already based on upstream main."
            exit 0
          fi

          cleanup_credentials() {
            git config --local --unset credential.helper >/dev/null 2>&1 || true
          }
          trap cleanup_credentials EXIT
          # The helper is evaluated by Git later, so this variable must remain
          # literal until the credential helper process runs.
          # shellcheck disable=SC2016
          git config --local credential.helper '!f() { echo username=x-access-token; echo password="$GITHUB_TOKEN"; }; f'
          git push --force-with-lease="refs/heads/main:$ORIGIN_SHA" origin HEAD:main

      - id: release
        name: Resolve release metadata
        shell: bash
        env:
          FORCE_RELEASE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          ref="$(git rev-parse HEAD)"
          current_version="$(node -p "require('./apps/desktop/package.json').version")"
          stable_version="${current_version%%-*}"
          IFS=. read -r major minor patch <<< "$stable_version"
          base_version="$major.$minor.$((patch + 1))"
          release_date="$(date -u +%Y%m%d)"
          version="$base_version-lmdevv.$release_date.${GITHUB_RUN_NUMBER}"
          tag="v$version"
          latest_tag="$(git tag --list 'v*-lmdevv.*' --sort=-creatordate | head -n 1)"
          latest_ref=""
          if [[ -n "$latest_tag" ]]; then
            latest_ref="$(git rev-parse "$latest_tag^{commit}")"
          fi
          should_release=true
          if [[ "$FORCE_RELEASE" != "true" && "$latest_ref" == "$ref" ]]; then
            should_release=false
          fi
          {
            echo "ref=$ref"
            echo "should_release=$should_release"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify personal patches
    needs: sync
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Typecheck affected packages
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/shared typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/web typecheck
      - name: Run focused tests
        run: |
          vp test run \
            packages/contracts/src/keybindings.test.ts \
            apps/server/src/keybindings.test.ts \
            apps/web/src/keybindings.test.ts \
            apps/web/src/pickerNavigation.test.ts \
            apps/web/src/components/RightPanelTabs.test.tsx \
            apps/web/src/components/chat/composerProviderState.test.tsx

  build:
    name: Build ${{ matrix.label }}
    needs: [sync, verify]
    if: needs.sync.outputs.should_release == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: personal-resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.sync.outputs.version }}"
      - name: Build unsigned desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: lmdevv/t3code
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.sync.outputs.version }}" \
            --verbose
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-x64.yml"
            done
          fi
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish personal release
    needs: [sync, verify, build]
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ ! -f "$arm64_manifest" ]]; then
              echo "Missing arm64 manifest for $x64_manifest" >&2
              exit 1
            fi
            node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
            rm "$x64_manifest"
          done
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          target_commitish: ${{ needs.sync.outputs.ref }}
          name: T3 Code personal ${{ needs.sync.outputs.version }}
          body: |
            Unsigned personal build rebased onto upstream `main`.

            Includes editable Vim-style picker navigation, model-options access, and right-panel surface shortcuts.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
