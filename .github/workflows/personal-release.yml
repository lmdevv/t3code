name: Personal upstream sync and release

on:
  schedule:
    # GitHub cron schedules use UTC. Run five times daily without using minute
    # zero, which GitHub can delay.
    - cron: "17 0,4,8,12,16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when there are no new upstream commits
        required: false
        default: false
        type: boolean
  pull_request_target:
    types: [synchronize]

concurrency:
  group: personal-nightly-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    name: Prepare upstream sync candidate
    if: >-
      github.event_name != 'pull_request_target' ||
      (
        startsWith(github.head_ref, 'automation/upstream-sync-') &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      candidate_branch: ${{ steps.rebase.outputs.candidate_branch }}
      candidate_ref: ${{ steps.rebase.outputs.candidate_ref }}
      main_sha: ${{ steps.rebase.outputs.main_sha }}
      ref: ${{ steps.release.outputs.ref }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      upstream_sha: ${{ steps.rebase.outputs.upstream_sha }}
    steps:
      - name: Checkout personal main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - id: rebase
        name: Rebase patch stack onto official upstream
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath /dev/null
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch upstream main --tags --force
          main_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/main)"
          candidate_branch="automation/upstream-sync-${upstream_sha:0:12}"

          {
            echo "main_sha=$main_sha"
            echo "upstream_sha=$upstream_sha"
            echo "candidate_branch=$candidate_branch"
            echo "publish=false"
          } >> "$GITHUB_OUTPUT"

          is_snapshot_sha() {
            local branch="$1"
            local sha="$2"
            local prefix="${branch#automation/upstream-sync-}"
            [[ "$prefix" != "$branch" && "${sha:0:12}" == "$prefix" ]]
          }

          use_resolved_candidate() {
            local branch="$1"
            local sha="$2"
            local reason="$3"
            {
              echo "result=candidate"
              echo "candidate_branch=$branch"
              echo "candidate_ref=$sha"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            echo "$reason"
          }

          if git merge-base --is-ancestor "$upstream_sha" "$main_sha"; then
            {
              echo "result=up-to-date"
              echo "candidate_ref=$main_sha"
              echo "candidate_branch=main"
            } >> "$GITHUB_OUTPUT"
            echo "Personal main already contains upstream main at $upstream_sha."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            git fetch origin "$PR_HEAD_SHA"
            if is_snapshot_sha "$PR_HEAD_REF" "$PR_HEAD_SHA"; then
              {
                echo "result=pending"
                echo "candidate_ref=$main_sha"
              } >> "$GITHUB_OUTPUT"
              echo "PR head $PR_HEAD_SHA is still the unresolved upstream snapshot."
              exit 0
            fi
            prefix="${PR_HEAD_REF#automation/upstream-sync-}"
            if git merge-base --is-ancestor "$prefix" "$PR_HEAD_SHA"; then
              use_resolved_candidate "$PR_HEAD_REF" "$PR_HEAD_SHA" \
                "Promoting Codex-resolved candidate $PR_HEAD_SHA from $PR_HEAD_REF."
              exit 0
            fi
            {
              echo "result=pending"
              echo "candidate_ref=$main_sha"
            } >> "$GITHUB_OUTPUT"
            echo "PR head $PR_HEAD_SHA is not a descendant of snapshot $prefix."
            exit 0
          fi

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$candidate_branch" \
            --json number,url \
            --jq '.[0] | if . then "\(.number)\t\(.url)" else empty end' || true)"
          if [[ -n "$existing_pr" ]]; then
            git fetch origin \
              "refs/heads/$candidate_branch:refs/remotes/origin/$candidate_branch"
            existing_candidate="$(git rev-parse "refs/remotes/origin/$candidate_branch")"
            if ! is_snapshot_sha "$candidate_branch" "$existing_candidate" && \
              git merge-base --is-ancestor "$upstream_sha" "$existing_candidate"; then
              use_resolved_candidate "$candidate_branch" "$existing_candidate" \
                "Using resolved candidate $existing_candidate from $existing_pr."
              exit 0
            fi
            echo "An unresolved sync PR already exists for upstream $upstream_sha: $existing_pr"
            {
              echo "result=pending"
              echo "candidate_ref=$main_sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git rebase upstream/main
          rebase_status=$?
          set -e

          if [[ "$rebase_status" -eq 0 ]]; then
            git diff --check
            candidate_sha="$(git rev-parse HEAD)"
            {
              echo "result=candidate"
              echo "candidate_ref=$candidate_sha"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
            echo "Prepared candidate $candidate_sha on $candidate_branch."
            exit 0
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            conflict_files="$(git diff --name-only --diff-filter=U)"
            delimiter="CONFLICT_FILES_${GITHUB_RUN_ID}"
            {
              echo "result=conflict"
              echo "candidate_ref=$upstream_sha"
              echo "publish=true"
              echo "conflict_files<<$delimiter"
              printf '%s\n' "$conflict_files"
              echo "$delimiter"
            } >> "$GITHUB_OUTPUT"
            git rebase --abort
            git checkout --quiet --detach "$upstream_sha"
            echo "Prepared upstream snapshot $upstream_sha for a conflict PR."
            exit 0
          fi

          echo "result=error" >> "$GITHUB_OUTPUT"
          exit "$rebase_status"

      - name: Publish candidate branch
        if: steps.rebase.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN || github.token }}
          CANDIDATE_BRANCH: ${{ steps.rebase.outputs.candidate_branch }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup_credentials() {
            git config --local --unset credential.helper >/dev/null 2>&1 || true
          }
          trap cleanup_credentials EXIT
          # The helper is evaluated by Git later, so this variable must remain
          # literal until the credential helper process runs.
          # shellcheck disable=SC2016
          git config --local credential.helper '!f() { echo username=x-access-token; echo password="$GITHUB_TOKEN"; }; f'
          git push --force "origin" "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: Create or update conflict PR
        if: steps.rebase.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TRIGGER_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          CANDIDATE_BRANCH: ${{ steps.rebase.outputs.candidate_branch }}
          MAIN_SHA: ${{ steps.rebase.outputs.main_sha }}
          UPSTREAM_SHA: ${{ steps.rebase.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.rebase.outputs.conflict_files }}
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          title="chore(sync): resolve upstream rebase conflicts"
          body="$(cat <<EOF
          ## Automated upstream sync needs conflict resolution

          The scheduled sync could not rebase personal \`main\` onto the official
          \`pingdotgg/t3code/main\` without conflicts.

          - Personal main before sync: \`$MAIN_SHA\`
          - Official upstream: \`$UPSTREAM_SHA\`
          - Candidate branch: \`$CANDIDATE_BRANCH\`

          Conflicting paths:
          $(printf '%s\n' "$CONFLICT_FILES" | sed 's/^/- /')

          This PR is intentionally based on the upstream snapshot so GitHub can
          display the conflict against personal \`main\`. It must be reviewed and
          merged only after the normal checks pass.
          EOF
          )"
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$CANDIDATE_BRANCH" --json number,url --jq '.[0] | if . then "\(.number)\t\(.url)" else empty end' || true)"
          if [[ -n "$existing_pr" ]]; then
            pr_number="${existing_pr%%$'\t'*}"
            gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated existing conflict PR $existing_pr."
          else
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$CANDIDATE_BRANCH" \
              --title "$title" \
              --body "$body")"
            pr_number="${pr_url##*/}"
          fi

          if [[ -z "$CODEX_TRIGGER_TOKEN" ]]; then
            echo "Missing required Actions secret CODEX_TRIGGER_TOKEN." >&2
            exit 1
          fi
          trigger_actor="$(GH_TOKEN="$CODEX_TRIGGER_TOKEN" gh api user --jq .login)"
          if [[ "$trigger_actor" == "github-actions" || "$trigger_actor" == *"[bot]" ]]; then
            echo "CODEX_TRIGGER_TOKEN must authenticate as a user, not $trigger_actor." >&2
            exit 1
          fi
          prompt="$(cat <<EOF
          @codex Resolve this existing upstream-sync PR and push the completed
          result back to its current head branch \`$CANDIDATE_BRANCH\`. Do not
          create another branch or PR, and do not wait to merge it. GitHub
          Actions will promote the branch to personal main after you push.

          Start from personal \`origin/main\`, rebase the complete personal patch
          stack onto official upstream commit \`$UPSTREAM_SHA\`, and resolve every
          conflict. Preserve the current upstream architecture, accessibility,
          styling, and behavior while retaining all personal-fork features. That
          includes editable Vim-style picker navigation, model-options access,
          right-panel shortcuts, the browser-preview shortcut, catalog lazy
          loading, and keeping picker shortcuts out of the composer bundle.

          Before editing, verify \`GH_TOKEN\` is available without printing it and
          that \`gh auth status\` succeeds. Typecheck every affected package and
          confirm there are no conflict markers. Run focused tests for the files
          you changed. Do not block the push on full \`vp test\` failures that
          come from Codex Cloud running as root (permission tests that expect
          chmod to make files unwritable). Commit the result and push with:
          \`git -c credential.helper='!gh auth git-credential' push --force-with-lease origin HEAD:$CANDIDATE_BRANCH\`.
          Before finishing, query PR #$pr_number and verify its remote head SHA
          changed to the commit you pushed. If auth, network access, or the push
          fails, report the exact command and error instead of claiming the PR
          was updated. Do not change workflow authentication or unrelated files.
          EOF
          )"
          GH_TOKEN="$CODEX_TRIGGER_TOKEN" gh pr comment "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$prompt"
          stale_prs="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --json number,headRefName \
            | jq -r --arg keep "$pr_number" \
              '.[] | select(.headRefName | startswith("automation/upstream-sync-")) | select((.number|tostring) != $keep) | .number' \
            || true)"
          if [[ -n "$stale_prs" ]]; then
            while read -r stale; do
              [[ -z "$stale" ]] && continue
              gh pr close "$stale" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded by PR #$pr_number, which targets newer upstream $UPSTREAM_SHA." \
                || true
            done <<<"$stale_prs"
          fi
          echo "Triggered Codex as $trigger_actor on PR #$pr_number."

      - name: Resolve release metadata
        if: steps.rebase.outputs.result != 'conflict' && steps.rebase.outputs.result != 'pending'
        id: release
        shell: bash
        env:
          FORCE_RELEASE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          ref="${{ steps.rebase.outputs.candidate_ref }}"
          current_version="$(node -p "require('./apps/desktop/package.json').version")"
          stable_version="${current_version%%-*}"
          IFS=. read -r major minor patch <<< "$stable_version"
          base_version="$major.$minor.$((patch + 1))"
          release_date="$(date -u +%Y%m%d)"
          version="$base_version-lmdevv.$release_date.${GITHUB_RUN_NUMBER}"
          tag="v$version"
          latest_tag="$(git tag --list 'v*-lmdevv.*' --sort=-creatordate | head -n 1)"
          latest_ref=""
          if [[ -n "$latest_tag" ]]; then
            latest_ref="$(git rev-parse "$latest_tag^{commit}")"
          fi
          should_release=true
          if [[ "$FORCE_RELEASE" != "true" && "$latest_ref" == "$ref" ]]; then
            should_release=false
          fi
          {
            echo "ref=$ref"
            echo "should_release=$should_release"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: Promote verified candidate to personal main
    needs: [sync, verify, build]
    if: needs.sync.outputs.should_release == 'true' && needs.verify.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.promote.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref }}
          fetch-depth: 0
      - id: promote
        name: Fast-forward personal main to verified candidate
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN || github.token }}
          EXPECTED_MAIN_SHA: ${{ needs.sync.outputs.main_sha }}
          SHOULD_UPDATE: ${{ needs.sync.outputs.candidate_branch != '' && needs.sync.outputs.candidate_branch != 'main' }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          if [[ "$SHOULD_UPDATE" == "true" ]]; then
            cleanup_credentials() {
              git config --local --unset credential.helper >/dev/null 2>&1 || true
            }
            trap cleanup_credentials EXIT
            # The helper is evaluated by Git later, so this variable must remain
            # literal until the credential helper process runs.
            # shellcheck disable=SC2016
            git config --local credential.helper '!f() { echo username=x-access-token; echo password="$GITHUB_TOKEN"; }; f'
            git push --force-with-lease="refs/heads/main:$EXPECTED_MAIN_SHA" origin HEAD:main
            candidate_branch="${{ needs.sync.outputs.candidate_branch }}"
            existing_pr="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "$candidate_branch" \
              --json number \
              --jq '.[0].number // empty')"
            if [[ -n "$existing_pr" ]]; then
              gh pr close "$existing_pr" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Validated and promoted candidate $candidate_sha to personal main."
            fi
            git push origin --delete "$candidate_branch"
          else
            echo "Force release requested for the existing personal main commit."
          fi
          echo "ref=$candidate_sha" >> "$GITHUB_OUTPUT"

  failure-pr:
    name: Open PR for failed upstream sync
    needs: [sync, verify, build, promote]
    if: >-
      always() &&
      needs.sync.result == 'success' &&
      needs.sync.outputs.candidate_branch != '' &&
      (needs.verify.result == 'failure' || needs.build.result == 'failure' || needs.promote.result == 'failure')
    runs-on: ubuntu-24.04
    steps:
      - name: Create or update failure PR
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TRIGGER_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          CANDIDATE_BRANCH: ${{ needs.sync.outputs.candidate_branch }}
          MAIN_SHA: ${{ needs.sync.outputs.main_sha }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail
          title="chore(sync): fix failed upstream update"
          body="$(cat <<EOF
          ## Automated upstream sync failed validation

          The rebased candidate was not promoted to personal \`main\` because a
          downstream job failed.

          - Personal main before sync: \`$MAIN_SHA\`
          - Official upstream: \`$UPSTREAM_SHA\`
          - Candidate branch: \`$CANDIDATE_BRANCH\`
          - Verify job: \`$VERIFY_RESULT\`
          - Build job: \`$BUILD_RESULT\`
          - Promote job: \`$PROMOTE_RESULT\`

          EOF
          )"
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$CANDIDATE_BRANCH" --json number,url --jq '.[0] | if . then "\(.number)\t\(.url)" else empty end' || true)"
          if [[ -n "$existing_pr" ]]; then
            pr_number="${existing_pr%%$'\t'*}"
            gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Updated existing failure PR $existing_pr."
          else
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$CANDIDATE_BRANCH" \
              --title "$title" \
              --body "$body")"
            pr_number="${pr_url##*/}"
          fi

          if [[ -z "$CODEX_TRIGGER_TOKEN" ]]; then
            echo "Missing required Actions secret CODEX_TRIGGER_TOKEN." >&2
            exit 1
          fi
          trigger_actor="$(GH_TOKEN="$CODEX_TRIGGER_TOKEN" gh api user --jq .login)"
          if [[ "$trigger_actor" == "github-actions" || "$trigger_actor" == *"[bot]" ]]; then
            echo "CODEX_TRIGGER_TOKEN must authenticate as a user, not $trigger_actor." >&2
            exit 1
          fi
          prompt="$(cat <<EOF
          @codex Fix the failed checks on this existing upstream-sync PR and push
          the completed result back to its current head branch
          \`$CANDIDATE_BRANCH\`. Do not create another branch or PR, and do not
          wait to merge it. GitHub Actions will promote the branch after you push.

          Inspect the failed GitHub checks and their logs, fix the underlying
          issue while preserving both current upstream behavior and every
          personal-fork feature, and avoid unrelated changes. Before editing,
          verify \`GH_TOKEN\` is available without printing it and that
          \`gh auth status\` succeeds. Typecheck every affected package and run
          focused tests for the files you changed. Do not block the push on full
          \`vp test\` failures that come from Codex Cloud running as root.
          Commit the result and push with:
          \`git -c credential.helper='!gh auth git-credential' push --force-with-lease origin HEAD:$CANDIDATE_BRANCH\`.
          Before finishing, query the PR and verify its remote head SHA changed
          to the commit you pushed. If auth, network access, or the push fails,
          report the exact command and error instead of claiming the PR was
          updated. Do not change workflow authentication.
          EOF
          )"
          GH_TOKEN="$CODEX_TRIGGER_TOKEN" gh pr comment "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$prompt"
          echo "Triggered Codex as $trigger_actor on PR #$pr_number."

  verify:
    name: Verify personal patches
    needs: sync
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Typecheck affected packages
        run: |
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/shared typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/web typecheck
      - name: Run focused tests
        run: |
          vp test run \
            packages/contracts/src/keybindings.test.ts \
            apps/server/src/keybindings.test.ts \
            apps/web/src/keybindings.test.ts \
            apps/web/src/pickerNavigation.test.ts \
            apps/web/src/components/RightPanelTabs.test.tsx \
            apps/web/src/components/chat/composerProviderState.test.tsx

  build:
    name: Build ${{ matrix.label }}
    needs: [sync, verify]
    if: needs.sync.outputs.should_release == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: personal-resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}
      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.sync.outputs.version }}"
      - name: Build unsigned desktop artifact
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: lmdevv/t3code
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.sync.outputs.version }}" \
            --verbose
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-x64.yml"
            done
          fi
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish personal release
    needs: [sync, verify, build]
    if: needs.sync.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ ! -f "$arm64_manifest" ]]; then
              echo "Missing arm64 manifest for $x64_manifest" >&2
              exit 1
            fi
            node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
            rm "$x64_manifest"
          done
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.sync.outputs.tag }}
          target_commitish: ${{ needs.sync.outputs.ref }}
          name: T3 Code personal ${{ needs.sync.outputs.version }}
          body: |
            Unsigned personal build rebased onto upstream `main`.

            Includes editable Vim-style picker navigation, model-options access, and right-panel surface shortcuts.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
